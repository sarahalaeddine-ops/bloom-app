# Lint, test and build (web + app bundle) on every pull request and on pushes to master,
# then compile the Android app.
# Needs no secrets: without env vars Bloom builds as the offline demo.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Static export for the iOS/Android apps must keep building too.
      - run: npm run build:app

  # Compiles the Android app (debug, unsigned) so native config or plugin breakage shows up on the
  # PR. GitHub's Ubuntu runners include the Android SDK; Capacitor 8 needs JDK 21. iOS needs macOS
  # and signing, so it is built in Codemagic/Xcode instead (docs/sa6/app-store.md).
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run app:sync
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      # Installable test build for the founder's phone (Actions run → Artifacts → bloom-android-debug).
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
